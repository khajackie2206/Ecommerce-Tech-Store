# nginx config used by the web Docker image:
# serves the built React app and forwards /api to the NestJS container.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 5m;

  location /api/ {
    # "server" is the API service name in docker-compose.yml
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # Single-page app: unknown paths fall back to index.html so React Router can handle them
    try_files $uri $uri/ /index.html;
  }
}
